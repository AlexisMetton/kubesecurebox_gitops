# Grafana - Provisioning alerting (contact point Discord + règles)
# =================================================================
# Messages courts en français. Pas de spam "Resolved" sur Discord.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: monitoring
  labels:
    app: grafana
data:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: Discord
        receivers:
          - uid: discord-kubesecurebox
            type: discord
            disableResolveMessage: true
            settings:
              url: $DISCORD_WEBHOOK_URL
              useDiscordUsername: true
              title: "{{ .CommonLabels.alertname }}"
              message: "{{ .CommonAnnotations.summary }}"
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: kubesecurebox-infra
        folder: KubeSecureBox Alerts
        interval: 1m
        rules:
          - uid: instance-down
            title: Pi injoignable
            condition: A
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  expr: up == 0
                  refId: A
                  intervalMs: 1000
                  maxDataPoints: 43200
            noDataState: OK
            execErrState: Alerting
            for: 2m
            annotations:
              summary: "🔴 {{ $labels.instance }} ne répond plus (métriques absentes)."
            labels:
              severity: critical
          - uid: node-not-ready
            title: Nœud NotReady
            condition: B
            data:
              - refId: B
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  expr: kube_node_status_condition{condition="Ready",status="false"} == 1
                  refId: B
                  intervalMs: 1000
                  maxDataPoints: 43200
            noDataState: OK
            execErrState: Alerting
            for: 3m
            annotations:
              summary: "🟠 Le nœud {{ $labels.node }} est NotReady."
            labels:
              severity: warning
          - uid: pods-not-ready
            title: Pods non prêts
            condition: C
            data:
              - refId: C
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  expr: count(kube_pod_status_ready == 0) > 0
                  refId: C
                  intervalMs: 1000
                  maxDataPoints: 43200
            noDataState: OK
            execErrState: Alerting
            for: 5m
            annotations:
              summary: "🟠 Des pods ne passent pas leur sonde readiness (voir Grafana)."
            labels:
              severity: warning
          - uid: memory-low-cluster
            title: RAM cluster faible
            condition: D
            data:
              - refId: D
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  expr: sum(node_memory_MemAvailable_bytes)/sum(node_memory_MemTotal_bytes) < 0.1
                  refId: D
                  intervalMs: 1000
                  maxDataPoints: 43200
            noDataState: OK
            execErrState: Alerting
            for: 10m
            annotations:
              summary: "🟠 Moins de 10 % de RAM disponible sur le cluster."
            labels:
              severity: warning
          - uid: cpu-high-cluster
            title: CPU cluster élevé
            condition: E
            data:
              - refId: E
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
                  refId: E
                  intervalMs: 1000
                  maxDataPoints: 43200
            noDataState: OK
            execErrState: Alerting
            for: 10m
            annotations:
              summary: "🟠 CPU du cluster > 90 % depuis 5 min."
            labels:
              severity: warning
          - uid: disk-high-cluster
            title: Disque cluster plein
            condition: F
            data:
              - refId: F
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  expr: 1 - sum(node_filesystem_avail_bytes{fstype=~"ext4|xfs",mountpoint="/"})/sum(node_filesystem_size_bytes{fstype=~"ext4|xfs",mountpoint="/"}) > 0.85
                  refId: F
                  intervalMs: 1000
                  maxDataPoints: 43200
            noDataState: OK
            execErrState: Alerting
            for: 15m
            annotations:
              summary: "🟠 Disque racine > 85 % sur au moins un nœud."
            labels:
              severity: warning
          - uid: temperature-high
            title: Température Pi élevée
            condition: G
            data:
              - refId: G
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  expr: max by (instance) (node_hwmon_temp_celsius or node_thermal_zone_temp) > 80
                  refId: G
                  intervalMs: 1000
                  maxDataPoints: 43200
            noDataState: OK
            execErrState: Alerting
            for: 10m
            annotations:
              summary: "🌡️ {{ $labels.instance }} dépasse 80 °C (surveiller refroidissement)."
            labels:
              severity: warning
          - uid: personal-rag-ingest-failed
            title: RAG ingest échec
            condition: I
            data:
              - refId: I
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  expr: kube_job_status_failed{namespace="personal-rag", job_name=~"obsidian-ingest-.*"} > 0
                  refId: I
                  intervalMs: 1000
                  maxDataPoints: 43200
            noDataState: OK
            execErrState: Alerting
            for: 5m
            annotations:
              summary: "🟠 Ingestion Obsidian RAG en échec (namespace personal-rag)."
            labels:
              severity: warning
          - uid: load-high
            title: Charge système élevée
            condition: H
            data:
              - refId: H
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  expr: node_load1 > 8
                  refId: H
                  intervalMs: 1000
                  maxDataPoints: 43200
            noDataState: OK
            execErrState: Alerting
            for: 10m
            annotations:
              summary: "🟠 Charge 1 min > 8 sur {{ $labels.instance }}."
            labels:
              severity: warning
  03-policytree.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: Discord
        group_by: ["alertname", "instance"]
        group_wait: 1m
        group_interval: 15m
        repeat_interval: 12h
