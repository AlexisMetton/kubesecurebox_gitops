# Ingestion Obsidian — toutes les 6 heures
apiVersion: batch/v1
kind: CronJob
metadata:
  name: obsidian-ingest
  namespace: personal-rag
  labels:
    app: obsidian-ingest
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: obsidian-ingest
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoringDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          initContainers:
            - name: install-deps
              image: python:3.12-slim
              command:
                - bash
                - -c
                - pip install --no-cache-dir -r /code/requirements.txt -t /deps
              volumeMounts:
                - name: code
                  mountPath: /code
                - name: deps
                  mountPath: /deps
          containers:
            - name: ingest
              image: python:3.12-slim
              command:
                - bash
                - -c
                - export PYTHONPATH=/deps && cd /code && python sync_obsidian.py
              envFrom:
                - configMapRef:
                    name: personal-rag-config
              env:
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: postgres-password
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rag-secrets
                      key: OPENAI_API_KEY
              volumeMounts:
                - name: code
                  mountPath: /code
                - name: deps
                  mountPath: /deps
                - name: vault
                  mountPath: /vault
                  readOnly: true
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
          volumes:
            - name: code
              configMap:
                name: personal-rag-code
            - name: deps
              emptyDir: {}
            - name: vault
              persistentVolumeClaim:
                claimName: obsidian-vault
