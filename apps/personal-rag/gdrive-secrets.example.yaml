# Exemple — NE PAS committer avec les vraies valeurs
# 1. python rag-api/gdrive_auth.py  (après export GOOGLE_CLIENT_ID/SECRET)
# 2. kubectl create secret generic gdrive-secrets -n personal-rag \
#      --from-literal=GOOGLE_CLIENT_ID='...' \
#      --from-literal=GOOGLE_CLIENT_SECRET='...' \
#      --from-literal=GOOGLE_REFRESH_TOKEN='...' \
#      --dry-run=client -o yaml | kubeseal -o yaml > gdrive-secrets-sealed.yaml
# 3. Ajouter gdrive-secrets-sealed.yaml dans kustomization.yaml
# 4. kubectl patch cronjob gdrive-ingest -n personal-rag -p '{"spec":{"suspend":false}}'
apiVersion: v1
kind: Secret
metadata:
  name: gdrive-secrets
  namespace: personal-rag
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "xxx.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "xxx"
  GOOGLE_REFRESH_TOKEN: "xxx"
