apiVersion: v1
kind: ConfigMap
metadata:
  name: personal-rag-config
  namespace: personal-rag
data:
  VAULT_PATH: "/vault"
  CONTENT_SOURCE: "obsidian"
  PARA_ROOT: "Second Cerveau"
  SKIP_PATH_PREFIXES: "Second Cerveau/0 INBOX,Second Cerveau/_Import,Second Cerveau/6 GARDEN/A traiter,Second Cerveau/6 GARDEN/En cours"
  EMBEDDING_MODEL: "text-embedding-3-small"
  DEEPSEEK_MODEL: "deepseek-chat"
  CHUNK_TARGET_CHARS: "3000"
  CHUNK_OVERLAP_CHARS: "400"
  EMBED_BATCH_SIZE: "64"
  MOC_SEARCH_PENALTY: "0.15"
  PG_HOST: "postgres"
  PG_PORT: "5432"
  PG_DB: "rag"
  PG_USER: "rag_user"
  RAG_API_URL: "http://rag-api:8000"
  OBSIDIAN_VAULT_NAME: "Workspace"
