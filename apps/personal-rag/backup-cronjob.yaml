# Backup quotidien PostgreSQL RAG — rotation 14 jours
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-backups
  namespace: personal-rag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: personal-rag
  labels:
    app: postgres-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoringDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: backup
              image: pgvector/pgvector:pg16
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  DATE=$(date +%Y-%m-%d)
                  FILE="/backups/rag-${DATE}.sql.gz"
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$FILE"
                  find /backups -name 'rag-*.sql.gz' -mtime +14 -delete
                  echo "Backup OK : $FILE ($(du -h "$FILE" | cut -f1))"
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: postgres-user
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: postgres-password
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: postgres-db
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "300m"
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: rag-backups
