# Backend FastAPI — image mise à jour par GitHub Actions (stock_analyzer repo)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-analyzer-backend
  namespace: stock-analyzer
  labels:
    app: stock-analyzer-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-analyzer-backend
  template:
    metadata:
      labels:
        app: stock-analyzer-backend
    spec:
      containers:
        - name: backend
          image: ametton/stock-analyzer-backend:sha-0000000
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database-url
            - name: FMP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stock-analyzer-secrets
                  key: FMP_API_KEY
            - name: AUTH_EMAIL
              valueFrom:
                secretKeyRef:
                  name: stock-analyzer-secrets
                  key: AUTH_EMAIL
            - name: AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: stock-analyzer-secrets
                  key: AUTH_USERNAME
            - name: AUTH_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: stock-analyzer-secrets
                  key: AUTH_PASSWORD_HASH
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stock-analyzer-secrets
                  key: JWT_SECRET
            - name: AUTH_COOKIE_SECURE
              value: "true"
          envFrom:
            - configMapRef:
                name: stock-analyzer-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
