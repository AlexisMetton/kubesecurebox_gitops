# Frontend Next.js — image mise à jour par GitHub Actions (stock_analyzer repo)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-analyzer-frontend
  namespace: stock-analyzer
  labels:
    app: stock-analyzer-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-analyzer-frontend
  template:
    metadata:
      labels:
        app: stock-analyzer-frontend
    spec:
      containers:
        - name: frontend
          image: ametton/stock-analyzer-frontend:sha-898f724
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: BACKEND_URL
              value: http://stock-analyzer-backend:8000
            - name: AUTH_EMAIL
              valueFrom:
                secretKeyRef:
                  name: stock-analyzer-frontend-secrets
                  key: AUTH_EMAIL
            - name: AUTH_PASSWORD_HASH_B64
              valueFrom:
                secretKeyRef:
                  name: stock-analyzer-frontend-secrets
                  key: AUTH_PASSWORD_HASH_B64
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: stock-analyzer-frontend-secrets
                  key: AUTH_SECRET
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
