# Ingress NocoDB - HTTPS via cert-manager
# ========================================
# Accessible sur Tailscale : https://sheets.kubesecurebox.com
# DNS Cloudflare : A record sheets -> IP Tailscale du Pi master (proxy desactive).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nocodb-ingress
  namespace: nocodb
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/upstream-vhost: "sheets.kubesecurebox.com"
spec:
  ingressClassName: nginx
  rules:
    - host: sheets.kubesecurebox.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nocodb
                port:
                  number: 8080
  tls:
    - hosts:
        - sheets.kubesecurebox.com
      secretName: nocodb-kubesecurebox-tls
