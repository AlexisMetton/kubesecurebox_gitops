# Deployment NocoDB
# ==================
# App métier : base de données type spreadsheet. Accessible via https://sheets.kubesecurebox.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nocodb
  namespace: nocodb
  labels:
    app: nocodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nocodb
  template:
    metadata:
      labels:
        app: nocodb
    spec:
      containers:
        - name: nocodb
          image: nocodb/nocodb:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NC_PUBLIC_URL
              value: "https://sheets.kubesecurebox.com"
            - name: NC_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nocodb-auth-secrets
                  key: jwt-secret
            # Heap Node.js : sans cela, V8 plafonne ~256 Mo et crash au démarrage (exit 134)
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1280"
          volumeMounts:
            - name: nocodb-data
              mountPath: /usr/app/data
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
      volumes:
        - name: nocodb-data
          persistentVolumeClaim:
            claimName: nocodb-data
