# n8n - App métier (automation workflows)
# =======================================
# Accessible publiquement : https://automation.kubesecurebox.com
# Exposition via Cloudflare Tunnel, comme les autres sites publics du projet.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: n8n

resources:
  - namespace.yaml
  - n8n-encryption-key-sealed.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - certificate.yaml
  - ingress.yaml
  - rbac-ingress-nginx-tls.yaml

commonLabels:
  app.kubernetes.io/name: n8n
  app.kubernetes.io/part-of: kubesecurebox
