# Deployment cloudflared - connecteur Cloudflare Tunnel
# =====================================================
# Tunnel sortant vers Cloudflare pour kubesecurebox.com et www.
# Le token est fourni via TUNNEL_TOKEN (Secret) — jamais en argument CLI (invisible dans ps aux).
# Planifié sur pi-worker-02 (nœud infra) pour ne pas surcharger le master.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi-worker-02
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2024.12.2
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
