# Exemple — NE PAS committer avec les vraies valeurs
# Voir SETUP.md pour kubeseal / kubectl create secret
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: mcp-hub
type: Opaque
stringData:
  postgres-user: "rag_user"
  postgres-password: "CHANGE_ME"
  postgres-db: "rag"
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-hub-secrets
  namespace: mcp-hub
type: Opaque
stringData:
  # Même valeur que rag-secrets/RAG_API_TOKEN (namespace personal-rag)
  RAG_API_TOKEN: "CHANGE_ME"
  # Token admin initial (affiché une seule fois à toi). Après bootstrap, crée des tokens clients via API.
  MCP_BOOTSTRAP_ADMIN_TOKEN: "CHANGE_ME_LONG_RANDOM"
