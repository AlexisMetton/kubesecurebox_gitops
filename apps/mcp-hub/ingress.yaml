# Ingress MCP Hub — public via Cloudflare Tunnel
# ================================================
# Trafic : Internet → Cloudflare Tunnel → ingress-nginx (HTTP) → mcp-hub:8000
# DNS : Public Hostname Zero Trust (pas de A record Tailscale)
# Auth app : Bearer token (MCP /v1 + middleware /mcp)
# Optionnel : Cloudflare Access uniquement sur /admin (pas sur /mcp — Anthropic doit joindre le hub)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-hub-ingress
  namespace: mcp-hub
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Tunnel envoie du HTTP : ssl-redirect false évite les boucles HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/upstream-vhost: "mcp.kubesecurebox.com"
    # Sessions MCP / SSE potentiellement longues
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: mcp.kubesecurebox.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-hub
                port:
                  number: 8000
  tls:
    - hosts:
        - mcp.kubesecurebox.com
      secretName: mcp-kubesecurebox-tls
