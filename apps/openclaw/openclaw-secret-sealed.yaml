# Secret OpenClaw (chiffré avec Sealed Secrets)
# OPENCLAW_GATEWAY_TOKEN : obligatoire (dashboard). Ne plus le mettre en clair dans le ConfigMap.
# Pour ajouter ou changer OPENCLAW_GATEWAY_TOKEN (nouveau token = openssl rand -hex 32) :
#   Il faut recréer tout le secret avec TOUTES les clés (existantes + OPENCLAW_GATEWAY_TOKEN),
#   puis remplacer ce fichier par la sortie de kubeseal. Commande type :
#   kubectl create secret generic openclaw-secrets \
#     --from-literal=DEEPSEEK_API_KEY=xxx \
#     --from-literal=DISCORD_TOKEN=yyy \
#     --from-literal=OPENAI_AUDIO_API_KEY=sk-xxx \
#     --from-literal=OPENCLAW_GATEWAY_TOKEN=$(openssl rand -hex 32) \
#     --from-literal=TWILIO_ACCOUNT_SID=ACxxx \
#     --from-literal=TWILIO_AUTH_TOKEN=xxx \
#     --from-literal=TWILIO_FROM_NUMBER=+33... \
#     --dry-run=client -o yaml -n openclaw | kubeseal -o yaml
#   Récupérer le nouveau token affiché (ou le sauvegarder avant) pour l'entrer dans le dashboard.
# IMPORTANT : encryptedData doit contenir OPENCLAW_GATEWAY_TOKEN. Si absent, recréer le secret
# (toutes les clés) avec la commande ci-dessus et remplacer spec.encryptedData par le résultat.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: openclaw-secrets
  namespace: openclaw
spec:
  encryptedData:
    DEEPSEEK_API_KEY: 
    DISCORD_TOKEN: 
    OPENCLAW_GATEWAY_TOKEN: 
    OPENAI_AUDIO_API_KEY: 
    TWILIO_ACCOUNT_SID: 
    TWILIO_AUTH_TOKEN: 
    TWILIO_FROM_NUMBER: 
  template:
    metadata:
      creationTimestamp: null
      name: openclaw-secrets
      namespace: openclaw