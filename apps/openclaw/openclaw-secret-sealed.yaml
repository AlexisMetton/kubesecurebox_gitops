# Sealed Secret OpenClaw - Token Discord + Clé API DeepSeek
# ===========================================================
# Ce Secret contient les deux clés nécessaires pour OpenClaw :
# - DISCORD_TOKEN : Token du bot Discord
# - DEEPSEEK_API_KEY : Clé API DeepSeek (obtenir sur https://platform.deepseek.com/api_keys)
#   5M tokens gratuits au départ, puis très bon marché
#
# Pour créer ce Secret avec DEEPSEEK_API_KEY :
# 1. Obtenir la clé API DeepSeek sur https://platform.deepseek.com/api_keys (gratuit, créer un compte)
# 2. Créer un Secret temporaire avec les deux clés :
#
#    kubectl create secret generic openclaw-secrets \
#      --from-literal=DISCORD_TOKEN="VOTRE_TOKEN_DISCORD" \
#      --from-literal=DEEPSEEK_API_KEY="VOTRE_CLE_API_DEEPSEEK" \
#      --namespace=openclaw \
#      --dry-run=client -o yaml | kubeseal -o yaml > openclaw-secret-sealed.yaml
#
# 3. Remplacer ce fichier par la sortie complète de kubeseal
#
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: openclaw-secrets
  namespace: openclaw
spec:
  encryptedData:
    DEEPSEEK_API_KEY: 
    DISCORD_TOKEN: 
  template:
    metadata:
      creationTimestamp: null
      name: openclaw-secrets
      namespace: openclaw
