# Deployment OpenClaw - Assistant IA avec Discord
# ===============================================
# Utilise Ollama (modèle local Llama 3 2B) pour les réponses IA
# Intégration Discord pour la communication
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      # Résout "browser" pour que nginx démarre sans sidecar browser (coollabsio image)
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - browser
      containers:
        - name: openclaw
          # Image OpenClaw - nginx écoute sur 8080, gateway sur 18789
          image: coollabsio/openclaw:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            # Configuration depuis ConfigMap
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: OLLAMA_BASE_URL
            - name: OLLAMA_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: OLLAMA_API_KEY
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: OLLAMA_MODEL
            - name: DISCORD_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: DISCORD_ENABLED
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: LOG_LEVEL
            - name: MEMORY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: MEMORY_ENABLED
            - name: NODE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: NODE_OPTIONS
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: OPENCLAW_GATEWAY_TOKEN
            # Token Discord depuis Secret
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: DISCORD_TOKEN
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
