# Deployment OpenClaw - Assistant IA avec Discord
# ===============================================
# Utilise DeepSeek (API cloud) pour les réponses IA - beaucoup plus rapide qu'Ollama local
# Intégration Discord pour la communication
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      serviceAccountName: openclaw
      # Résout "browser" pour que nginx démarre sans sidecar browser (coollabsio image)
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - browser
      initContainers:
        # Supprime l'ancienne config persistée (voice-call/Twilio). À retirer après 1er démarrage réussi.
        - name: reset-persisted-config
          image: busybox:latest
          command: ["sh", "-c", "rm -f /data/.openclaw/openclaw.json; exit 0"]
          volumeMounts:
            - name: data
              mountPath: /data
        - name: copy-skills
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              for f in /config/skills/*; do
                [ -f "$f" ] || continue
                n="$(basename "$f")"
                mkdir -p "/data/skills/$n"
                cp "$f" "/data/skills/$n/SKILL.md"
              done
          volumeMounts:
            - name: openclaw-skills
              mountPath: /config/skills
              readOnly: true
            - name: data
              mountPath: /data
      containers:
        - name: openclaw
          # Image OpenClaw - nginx écoute sur 8080, gateway sur 18789
          image: coollabsio/openclaw:latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 18789
              name: gateway
            - containerPort: 3334
              name: voice-webhook
          env:
            # Configuration depuis ConfigMap
            - name: OPENCLAW_PRIMARY_MODEL
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: OPENCLAW_PRIMARY_MODEL
            # Clé API DeepSeek depuis Secret (utilise OPENAI_API_KEY car DeepSeek est compatible OpenAI)
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: DEEPSEEK_API_KEY
            # Chemin vers le fichier JSON personnalisé (pour configurer DeepSeek)
            - name: OPENCLAW_CUSTOM_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: OPENCLAW_CUSTOM_CONFIG
            - name: DISCORD_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: DISCORD_ENABLED
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: LOG_LEVEL
            - name: MEMORY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: MEMORY_ENABLED
            - name: NODE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: NODE_OPTIONS
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: OPENCLAW_GATEWAY_TOKEN
            # Token Discord depuis Secret (DISCORD_BOT_TOKEN = fallback attendu par OpenClaw)
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: DISCORD_TOKEN
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: DISCORD_TOKEN
            # Clé OpenAI pour l'audio uniquement (Whisper/TTS ; DeepSeek ne gère pas l'audio)
            - name: OPENAI_AUDIO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENAI_AUDIO_API_KEY
            # Voice-call (Twilio) : valeurs factices pour que la config se charge ; plugin disabled. Remplacer par secret quand Twilio activé.
            - name: TWILIO_ACCOUNT_SID
              value: ""
            - name: TWILIO_AUTH_TOKEN
              value: ""
            - name: TWILIO_FROM_NUMBER
              value: ""
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # Probes : /healthz exposé par nginx (doc coollabsio). Délais très longs : Discord + gateway peuvent prendre 5 min.
          livenessProbe:
            exec:
              command: ["curl", "-sf", "http://127.0.0.1:8080/healthz"]
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["curl", "-sf", "http://127.0.0.1:8080/healthz"]
            initialDelaySeconds: 300
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: custom-config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: custom-config
          configMap:
            name: openclaw-custom-config
        - name: openclaw-skills
          configMap:
            name: openclaw-skills
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
