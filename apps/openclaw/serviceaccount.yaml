# ServiceAccount OpenClaw - Pour l'accès kubectl au cluster
# ==========================================================
# Utilisé par le pod OpenClaw pour s'authentifier auprès de l'API Kubernetes
# et exécuter des commandes kubectl (skill kubectl)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app: openclaw
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/part-of: kubesecurebox
