# ConfigMap OpenClaw - Configuration Discord + DeepSeek
# =====================================================
# Configuration pour intégration Discord et modèle IA DeepSeek (API cloud directe)
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  # Configuration DeepSeek (API cloud directe - beaucoup plus rapide qu'Ollama local)
  # Clé API DeepSeek à mettre dans Secret (obtenir sur https://platform.deepseek.com/api_keys)
  # DEEPSEEK_API_KEY sera dans le Secret mais injectée dans OPENAI_API_KEY (DeepSeek compatible OpenAI)
  # La configuration DeepSeek est dans openclaw-custom-config.yaml (fichier JSON monté)
  # Force le modèle primaire (format: provider/model-id)
  OPENCLAW_PRIMARY_MODEL: "openai/deepseek-chat"
  # Chemin vers le fichier JSON personnalisé (monté depuis ConfigMap)
  OPENCLAW_CUSTOM_CONFIG: "/app/config/openclaw.json"
  
  # Configuration Ollama (désactivée, gardée en commentaire pour référence)
  # OLLAMA_BASE_URL: "http://ollama.ollama.svc.cluster.local:11434/v1"
  # OLLAMA_API_KEY: "ollama-local"
  # OLLAMA_MODEL: "llama3.2:1b"
  
  # Configuration Discord
  DISCORD_ENABLED: "true"
  # Token Discord à mettre dans Secret (créer un bot sur https://discord.com/developers/applications)
  # DISCORD_TOKEN sera dans le Secret
  
  # Configuration générale
  LOG_LEVEL: "info"
  MEMORY_ENABLED: "true"
  # Augmente la heap Node.js pour éviter "JavaScript heap out of memory"
  NODE_OPTIONS: "--max-old-space-size=768"
  
  # Token Gateway OpenClaw (requis pour l'interface web)
  # Généré avec: openssl rand -hex 32
  OPENCLAW_GATEWAY_TOKEN: "ab593e01ad39bbf8eb003202f624c580d713a8f26cff8c0c4374c1b5de8de904"