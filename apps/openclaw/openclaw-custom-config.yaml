# ConfigMap OpenClaw - Configuration JSON personnalisée pour DeepSeek
# ===================================================================
# Ce fichier JSON configure DeepSeek directement via l'API DeepSeek
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-custom-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "models": {
        "mode": "merge",
        "providers": {
          "deepseek": {
            "baseUrl": "https://api.deepseek.com/v1",
            "apiKey": "${DEEPSEEK_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "deepseek-chat",
                "name": "DeepSeek Chat (V3.2)",
                "reasoning": false,
                "input": ["text"],
                "contextWindow": 128000,
                "maxTokens": 8192
              },
              {
                "id": "deepseek-reasoner",
                "name": "DeepSeek Reasoner (V3.2)",
                "reasoning": true,
                "input": ["text"],
                "contextWindow": 128000,
                "maxTokens": 65536
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "deepseek/deepseek-chat"
          }
        }
      }
    }
