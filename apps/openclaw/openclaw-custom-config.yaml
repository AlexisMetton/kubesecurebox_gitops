# ConfigMap OpenClaw - Configuration JSON personnalisée pour DeepSeek
# ===================================================================
# Ce fichier JSON configure DeepSeek via le provider OpenAI (compatible)
# DeepSeek utilise une API compatible OpenAI, donc on utilise le provider "openai"
# avec baseUrl pointant vers https://api.deepseek.com/v1
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-custom-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "models": {
        "mode": "merge",
        "providers": {
          "openai": {
            "baseUrl": "https://api.deepseek.com/v1",
            "apiKey": "${OPENAI_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "deepseek-chat",
                "name": "DeepSeek Chat (V3.2)",
                "reasoning": false,
                "input": ["text"],
                "contextWindow": 128000,
                "maxTokens": 8192
              },
              {
                "id": "deepseek-reasoner",
                "name": "DeepSeek Reasoner (V3.2)",
                "reasoning": true,
                "input": ["text"],
                "contextWindow": 128000,
                "maxTokens": 65536
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "openai/deepseek-chat"
          }
        }
      },
      "skills": {
        "entries": {
          "kubectl": {
            "enabled": true
          }
        }
      }
    }
