# ConfigMap OpenClaw - Configuration JSON personnalisée pour DeepSeek + audio OpenAI
# ================================================================================
# DeepSeek : provider "openai" avec baseUrl api.deepseek.com (texte uniquement).
# Audio (Whisper/TTS) : provider "openai-audio" avec api.openai.com (OPENAI_AUDIO_API_KEY).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-custom-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "models": {
        "mode": "merge",
        "providers": {
          "openai": {
            "baseUrl": "https://api.deepseek.com/v1",
            "apiKey": "${OPENAI_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "deepseek-chat",
                "name": "DeepSeek Chat (V3.2)",
                "reasoning": false,
                "input": ["text"],
                "contextWindow": 128000,
                "maxTokens": 8192
              },
              {
                "id": "deepseek-reasoner",
                "name": "DeepSeek Reasoner (V3.2)",
                "reasoning": true,
                "input": ["text"],
                "contextWindow": 128000,
                "maxTokens": 65536
              }
            ]
          },
          "openai-audio": {
            "baseUrl": "https://api.openai.com/v1",
            "apiKey": "${OPENAI_AUDIO_API_KEY}",
            "api": "openai-completions",
            "models": []
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "openai/deepseek-chat"
          }
        }
      },
      "skills": {
        "entries": {
          "kubectl": {
            "enabled": true
          }
        }
      },
      "channels": {
        "discord": {
          "enabled": true,
          "dmPolicy": "allowlist",
          "allowFrom": ["571976616402747402"],
          "groupPolicy": "allowlist",
          "groupAllowFrom": ["1473390625671086142"],
          "groups": {
            "1473390625671086142": { "requireMention": false }
          }
        },
        "whatsapp": {
          "enabled": true,
          "dmPolicy": "allowlist",
          "allowFrom": ["+33785601593"]
        }
      },
      "tools": {
        "media": {
          "audio": {
            "enabled": true,
            "maxBytes": 20971520,
            "models": [
              { "provider": "openai-audio", "model": "gpt-4o-mini-transcribe" }
            ]
          }
        }
      },
      "messages": {
        "tts": {
          "auto": "off",
          "provider": "openai",
          "openai": {
            "apiKey": "${OPENAI_AUDIO_API_KEY}",
            "model": "gpt-4o-mini-tts",
            "voice": "alloy"
          }
        }
      },
      "plugins": {
        "entries": {
          "voice-call": {
            "enabled": false,
            "config": {
              "provider": "twilio",
              "fromNumber": "${TWILIO_FROM_NUMBER}",
              "twilio": {
                "accountSid": "${TWILIO_ACCOUNT_SID}",
                "authToken": "${TWILIO_AUTH_TOKEN}"
              },
              "serve": {
                "port": 3334,
                "path": "/voice/webhook"
              },
              "publicUrl": "https://openclaw.kubesecurebox.com/voice/webhook",
              "webhookSecurity": {
                "allowedHosts": ["openclaw.kubesecurebox.com"]
              },
              "outbound": {
                "defaultMode": "notify"
              }
            }
          }
        }
      }
    }
