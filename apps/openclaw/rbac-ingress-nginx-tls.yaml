# RBAC pour Ingress NGINX - accès aux secrets TLS
# ===============================================
# Permet à Ingress NGINX de lire les secrets TLS générés par cert-manager
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-nginx-tls-reader
  namespace: openclaw
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-nginx-tls-reader
  namespace: openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress-nginx-tls-reader
subjects:
  - kind: ServiceAccount
    name: ingress-nginx
    namespace: ingress-nginx
