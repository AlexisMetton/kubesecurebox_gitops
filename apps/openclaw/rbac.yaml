# RBAC OpenClaw - Droits complets sur le cluster (cluster-admin)
# ===============================================================
# Le ServiceAccount openclaw est lié au ClusterRole cluster-admin (intégré Kubernetes).
# OpenClaw peut ainsi exécuter toute action kubectl sur toutes les ressources du cluster.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-cluster-admin
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/part-of: kubesecurebox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: openclaw
