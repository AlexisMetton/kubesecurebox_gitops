# PVC OpenClaw - stockage persistant pour état, config et mémoire
# ================================================================
# /data dans l'image coollabsio : .openclaw/ (state, config), workspace/, MEMORY.md
# Utilise la StorageClass par défaut du cluster (comme Matomo) = ton disque 4 To si c'est le défaut.
# Pas de storageClassName = même backend que matomo-data, souvent NFS ou stockage partagé.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Pas de storageClassName : utilise la default (comme Matomo), typiquement ton DD 4 To
