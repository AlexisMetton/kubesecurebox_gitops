# OpenClaw - Assistant IA avec Discord et DeepSeek
# =================================================
# Utilise DeepSeek (API cloud) pour les réponses IA - beaucoup plus rapide qu'Ollama local
# Intégration Discord pour la communication
# Accessible sur Tailscale : https://openclaw.kubesecurebox.com
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openclaw

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - openclaw-custom-config.yaml
  - openclaw-secret-sealed.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - certificate.yaml
  - ingress.yaml
  - rbac-ingress-nginx-tls.yaml

commonLabels:
  app.kubernetes.io/name: openclaw
  app.kubernetes.io/part-of: kubesecurebox
