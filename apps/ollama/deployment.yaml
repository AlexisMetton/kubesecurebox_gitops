# Deployment Ollama - modèle IA local (Llama 3.2 1B)
# ==================================================
# Ressources augmentées pour améliorer la rapidité de l'inférence
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # Obligatoire : Ollama ne tourne que sur les nœuds avec ce label (Pi 5 workers).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoringDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubesecurebox.io/ollama
                    operator: In
                    values:
                      - "true"
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: "/models"
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              memory: "3Gi"
              cpu: "1000m"
            limits:
              memory: "5Gi"
              cpu: "3000m"
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
